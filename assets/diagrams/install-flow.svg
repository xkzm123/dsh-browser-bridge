<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="430" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1179" height="429" rx="14" fill="none" stroke="#d0d7de"/>

  <text x="40" y="52" font-size="20" font-weight="700" fill="#1f2328">三步装好</text>
  <text x="40" y="78" font-size="14" fill="#57606a">只需要 Windows + 已经在用的 DSH；不需要 Python、Node 环境变量或其他运行库</text>

  <!-- step 1 -->
  <rect x="40" y="110" width="330" height="180" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="72" cy="142" r="14" fill="#0969da"/>
  <text x="72" y="147" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="96" y="147" font-size="15" font-weight="700" fill="#1f2328">装插件</text>
  <text x="60" y="182" font-size="12" fill="#57606a">在你的电脑上跑这一条：</text>
  <rect x="56" y="196" width="298" height="52" rx="6" fill="#0d1117"/>
  <text x="68" y="218" font-size="10.5" fill="#7ee787" font-family="ui-monospace,Consolas,monospace">dsh plugin --profile web add</text>
  <text x="68" y="236" font-size="10.5" fill="#7ee787" font-family="ui-monospace,Consolas,monospace">  github:xkzm123/dsh-browser-bridge</text>
  <text x="60" y="270" font-size="11" fill="#8c959f">桌面版：设置 → 插件 → 搜索安装</text>

  <!-- step 2 -->
  <rect x="415" y="110" width="330" height="180" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="447" cy="142" r="14" fill="#0969da"/>
  <text x="447" y="147" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="471" y="147" font-size="15" font-weight="700" fill="#1f2328">重启一次 DSH</text>
  <text x="435" y="182" font-size="12" fill="#57606a">插件只在启动时加载，重启后生效。</text>
  <text x="435" y="204" font-size="12" fill="#57606a">关掉 dsh web，再开一次即可。</text>
  <rect x="431" y="222" width="298" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="443" y="243" font-size="11" fill="#1f2328" font-family="ui-monospace,Consolas,monospace">浏览器标签页会恢复，登录态不丢</text>

  <!-- step 3 -->
  <rect x="790" y="110" width="350" height="180" rx="10" fill="#eef4ff" stroke="#b6d3fb"/>
  <circle cx="822" cy="142" r="14" fill="#0969da"/>
  <text x="822" y="147" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="846" y="147" font-size="15" font-weight="700" fill="#1f2328">跟它说一句话</text>
  <text x="810" y="184" font-size="12" fill="#57606a">不需要记命令，直接说：</text>
  <rect x="806" y="198" width="318" height="34" rx="6" fill="#ffffff" stroke="#b6d3fb"/>
  <text x="818" y="219" font-size="11.5" fill="#0a3069">「看看我浏览器现在开着什么」</text>
  <text x="810" y="254" font-size="12" fill="#57606a">AI 会自己调 browser_* 工具，</text>
  <text x="810" y="272" font-size="12" fill="#57606a">点完还会截图给你确认。</text>

  <!-- arrows -->
  <line x1="374" y1="200" x2="411" y2="200" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="749" y1="200" x2="786" y2="200" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- optional -->
  <rect x="40" y="318" width="1100" height="76" rx="10" fill="#fff8f0" stroke="#f0c193"/>
  <circle cx="72" cy="356" r="14" fill="#bc4c00"/>
  <text x="72" y="361" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">+</text>
  <text x="96" y="350" font-size="14" font-weight="700" fill="#7d4e00">可选：装一次篡改猴脚本（想要「执行 JavaScript」时才需要）</text>
  <text x="96" y="372" font-size="12" fill="#7d4e00">跳过它也有 14 个工具可用 —— 只是没法在页面里跑自定义脚本。</text>
  <text x="96" y="388" font-size="12" fill="#7d4e00">装法见下方「要不要装油猴脚本」一节，两分钟。</text>
</svg>
